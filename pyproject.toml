[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-candidate-list"
version = "0.1.0"
description = "応募候補リスト作成（第1段階）: 志向プロファイルに基づく求人候補の収集・判定・提示"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]

[project.scripts]
job-candidate-list = "job_candidate_list.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
